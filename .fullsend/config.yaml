# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
tracker:
    github:
        allowed_targets:
            repos:
                - fullsend-ai/fullsend
                - fullsend-ai/agents
runtime: dummy
agents:
    - name: gateway-probe
      source: harness/gateway-probe.yaml
inference:
    gateway:
        url: https://fullsend-e2e-gateway-208332380190.us-east5.run.app
        audience: fullsend-e2e-gateway
        models:
            claude-haiku-5-5:
                api: anthropic-messages
                compat:
                    supportsStrictTools: false
